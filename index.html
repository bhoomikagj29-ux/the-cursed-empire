function createMountain(x, z, height, width) {

            height * 0.3,
            8

        stoneMaterial
    );

    peak.position.y = height * 0.82;

    mountain.add(peak);

    mountain.position.set(x, 0, z);

    scene.add(mountain);
}

        new THREE.IcosahedronGeometry(
            1.6 * size,
            1

        darkLeafMaterial

    lowerLeaves.position.y = 3.6 * size;
    lowerLeaves.castShadow = true;

    tree.add(lowerLeaves);

        new THREE.IcosahedronGeometry(

            1

        leafMaterial
    );

    upperLeaves.position.y = 4.8 * size;
    upperLeaves.castShadow = true;

    tree.add(upperLeaves);

    tree.position.set(x, 0, z);

    scene.add(tree);

    return tree;
}

// 10. MAGICAL RIVER

const riverCurve = new THREE.CatmullRomCurve3([

    new THREE.Vector3(-30, 0.12, 14),
    new THREE.Vector3(-24, 0.12, 8),
    new THREE.Vector3(-19, 0.12, 0),
    new THREE.Vector3(-21, 0.12, -10),
    new THREE.Vector3(-17, 0.12, -20),
    new THREE.Vector3(-8, 0.12, -34)

]);

function createRiver(curve, width) {

    const vertices = [];
    const indices = [];

    const segments = 120;

    for (let i = 0; i <= segments; i++) {

        const t = i / segments;

        const point = curve.getPoint(t);
        const tangent = curve.getTangent(t);

        const side = new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        ).normalize();

        const left = point.clone().addScaledVector(
            side,
            width
        );

        const right = point.clone().addScaledVector(
            side,
            -width
        );

        vertices.push(
            left.x, left.y, left.z,
            right.x, right.y, right.z
        );

        if (i < segments) {

            const a = i * 2;
            const b = a + 1;
            const c = a + 2;
            const d = a + 3;

            indices.push(a, b, c);
            indices.push(b, d, c);
        }
    }

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(vertices, 3)
    );

    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    const river = new THREE.Mesh(
        geometry,
        waterMaterial
    );

    river.material.side = THREE.DoubleSide;
    river.receiveShadow = true;

    scene.add(river);

    return river;
}

const river = createRiver(riverCurve, 1.8);

// ============================================

const castle = new THREE.Group();

    );

}

// Castle windows

scene.add(castle);

// ============================================

const temple = new THREE.Group();

);

templeBase.position.y = 0.5;

templeRoof.position.y = 8;
templeRoof.rotation.y = Math.PI / 4;

// Temple pillars

temple.position.set(-17, 0, -17);

// ============================================

// ============================================

const crystals = [];

const crystalMaterial = new THREE.MeshStandardMaterial({
    color: 0xa65aff,
    emissive: 0x791fff,
    emissiveIntensity: 2,
    metalness: 0.4,

});

function createCrystal(x, z) {

    const crystal = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.7),

    crystal.position.set(x, 1.5, z);
    crystal.castShadow = true;

    scene.add(crystal);

    crystals.push(crystal);

    const glow = new THREE.PointLight(
        0x953dff,
        8,
        9
    );

    glow.position.set(x, 1.5, z);

    scene.add(glow);
}

createCrystal(-11, 5);
createCrystal(11, 0);
createCrystal(-15, -10);
createCrystal(15, -12);
createCrystal(5, -18);

// ============================================
// 14. SMALL ANCIENT ROCKS
// ============================================

for (let i = 0; i < 35; i++) {

    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(
            0.4 + Math.random() * 0.7,
            0
        ),
        stoneMaterial
    );

    rock.position.set(
        (Math.random() - 0.5) * 65,
        0.3,
        (Math.random() - 0.5) * 65

        Math.random(),

// ============================================
// 15. FEMALE TRAVELER
// ============================================

const traveler = new THREE.Group();

scene.add(traveler);

// Character materials
const skinMaterial = new THREE.MeshStandardMaterial({
    color: 0xb97855,
    roughness: 0.85
});

const hairMaterial = new THREE.MeshStandardMaterial({
    color: 0x211510,
    roughness: 0.9
});

const jacketMaterial = new THREE.MeshStandardMaterial({
    color: 0x70452d,
    roughness: 0.85
});

const clothesMaterial = new THREE.MeshStandardMaterial({
    color: 0x29212a,
    roughness: 0.9
});

const leatherMaterial = new THREE.MeshStandardMaterial({
    color: 0x49301f,
    roughness: 0.9
});

const eyeMaterial = new THREE.MeshStandardMaterial({
    color: 0x21130f
});

// Character helper
function addPart(
    geometry,
    material,
    x,
    y,
    z,
    parent = traveler
) {

    const part = new THREE.Mesh(
        geometry,
        material
    );

    part.position.set(x, y, z);

    part.castShadow = true;
    part.receiveShadow = true;

    parent.add(part);

    return part;
}

// Body

);

// Waist

    new THREE.CylinderGeometry(
        0.37, 0.38, 0.25, 16

);

// ============================================
// 16. CAMERA CONTROLS
// ============================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.enablePan = false;

controls.minDistance = 5;
controls.maxDistance = 22;

controls.maxPolarAngle = Math.PI / 2.05;

controls.target.set(0, 1.5, 7);

// ============================================
// 17. KEYBOARD MOVEMENT
// ============================================

const keyboard = {};

window.addEventListener('keydown', (event) => {

    keyboard[event.key.toLowerCase()] = true;

});

window.addEventListener('keyup', (event) => {

    keyboard[event.key.toLowerCase()] = false;

});

window.addEventListener('blur', () => {

    Object.keys(keyboard).forEach(key => {
        keyboard[key] = false;
    });

});

// ============================================
// 18. ANIMATION
// ============================================

const clock = new THREE.Clock();

const previousPosition = traveler.position.clone();

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    // Movement
    let moveX = 0;
    let moveZ = 0;

    if (keyboard['w'] || keyboard['arrowup']) {
        moveZ -= 1;
    }

    if (keyboard['s'] || keyboard['arrowdown']) {
        moveZ += 1;
    }

    if (keyboard['a'] || keyboard['arrowleft']) {
        moveX -= 1;
    }

    if (keyboard['d'] || keyboard['arrowright']) {
        moveX += 1;
    }

    const length = Math.hypot(moveX, moveZ);

    if (length > 0) {

        moveX /= length;
        moveZ /= length;

        const speed = 4;

        traveler.position.x += moveX * speed * delta;
        traveler.position.z += moveZ * speed * delta;

        traveler.rotation.y = Math.atan2(
            moveX,
            -moveZ
        );

    }

    // Camera follows traveler
    const movement = traveler.position.clone()
        .sub(previousPosition);
        camera.position.add(movement);
    controls.target.add(movement);

    previousPosition.copy(traveler.position);

    // Crystal animation
    crystals.forEach((crystal, index) => {

        crystal.rotation.y += delta;
        crystal.rotation.x += delta * 0.5;

        crystal.position.y =
            1.5 +
            Math.sin(clock.elapsedTime * 2 + index) * 0.3;

    });

    // Water shimmer
    waterMaterial.emissiveIntensity =
        0.5 + Math.sin(clock.elapsedTime * 2) * 0.15;

    controls.update();

    renderer.render(scene, camera);
}

// ============================================
// 19. START THE GAME

// ============================================

animate();

document.getElementById('loading').style.display = 'none';

// ============================================
// 20. WINDOW RESIZE
// ============================================

window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});
</script>
